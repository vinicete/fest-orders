services:
  db:
    ports:
      - "5433:5432" # Expõe o banco no Windows para acessar via pgAdmin

  api:
    ports:
      - "3003:3002"
    volumes:
      - ./back:/usr/src/app        # Hot-reload: espelha código local no container
      - /usr/src/app/node_modules  # Preserva o node_modules de dentro do container
    env_file:
      - ./back/.env
    command: npm run start:dev     # Roda com hot-reload (ts-node-dev)
    restart: unless-stopped

  web:
    ports:
      - "4200:4200"
    volumes:
      - ./front:/usr/src/app        # Hot-reload: espelha código local no container
      - /usr/src/app/node_modules   # Preserva o node_modules de dentro do container
    command: npm run start -- --host 0.0.0.0 --poll 2000
    restart: unless-stopped
